name: jobsite_rafter_calculator
description: A high-contrast job-site rafter calculator for Apple and Android.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.11.0

flutter_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
